<script>
// ===== STATE =====
const state = {
    schoolName: "",
    academicYear: "2025-2026",
    canteenRent: {
        shopName: "Okul Kantini",
        operatorName: "",
        contractDate: "",
        lastYearRent: 0,
        tufeRate: 36.00,
        viewMode: 'hesaplama',
        sozlesme: {
            birlikAdres: "", birlikTel: "", birlikFaks: "",
            kiraciAdres: "", kiraciEvTel: "", kiraciIsTel: "",
            il: "", ilce: "",
            ada: "", parsel: "", arsaM2: "", kantinM2: "",
            isletmeTuru: "Kantin", sozlesmeSuresiYil: "5",
            mahkeme: "", ozelSartlar: ""
        },
        payments: {
            "Eylül": { type: "Tam", status: "Ödenmedi", receiptNo: "", date: "" },
            "Ekim": { type: "Tam", status: "Ödenmedi", receiptNo: "", date: "" },
            "Kasım": { type: "Tam", status: "Ödenmedi", receiptNo: "", date: "" },
            "Aralık": { type: "Tam", status: "Ödenmedi", receiptNo: "", date: "" },
            "Ocak": { type: "Tam", status: "Ödenmedi", receiptNo: "", date: "" },
            "Şubat": { type: "Tam", status: "Ödenmedi", receiptNo: "", date: "" },
            "Mart": { type: "Tam", status: "Ödenmedi", receiptNo: "", date: "" },
            "Nisan": { type: "Tam", status: "Ödenmedi", receiptNo: "", date: "" },
            "Mayıs": { type: "Tam", status: "Ödenmedi", receiptNo: "", date: "" },
            "Haziran": { type: "Tam", status: "Ödenmedi", receiptNo: "", date: "" }
        }
    }
};

// ===== HELPERS =====
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(n) { return (n||0).toLocaleString('tr-TR', {style:'currency', currency:'TRY'}); }
function formatTRDate(iso) { if (!iso) return '../../....'; const [y,m,d] = iso.split('-'); return d+'.'+m+'.'+y; }

function calculateCanteenRentData() {
    const cr = state.canteenRent;
    const lastRent = parseFloat(cr.lastYearRent) || 0;
    const rate = parseFloat(cr.tufeRate) / 100 || 0;
    const annualRent = lastRent * (1 + rate);
    const arzBedeli = annualRent * 0.03;
    const netAnnualRent = annualRent - arzBedeli;
    const ilPayiYillik = netAnnualRent * 0.10;
    const ilcePayiYillik = netAnnualRent * 0.10;
    const birlikPayiYillik = netAnnualRent * 0.80;
    const kesinTeminat = annualRent * 0.06;
    const monthCount = Object.keys(cr.payments).length;
    const monthlyNetRent = netAnnualRent / monthCount;
    const ilPayiAylik = monthlyNetRent * 0.10;
    const ilcePayiAylik = monthlyNetRent * 0.10;

    let totalWeight = 0;
    for (let m in cr.payments) totalWeight += cr.payments[m].type === "Yarım" ? 0.5 : 1;
    const baseUnit = birlikPayiYillik / totalWeight;

    const monthlyAmounts = {};
    let totalAccrued = 0, totalCollected = 0;
    for (let m in cr.payments) {
        const w = cr.payments[m].type === "Yarım" ? 0.5 : 1;
        const amt = baseUnit * w;
        monthlyAmounts[m] = amt;
        totalAccrued += amt;
        if (cr.payments[m].status === "Ödendi") totalCollected += amt;
    }

    return { lastRent, ratePercent: (rate*100).toFixed(2), annualRent, arzBedeli, netAnnualRent,
        monthlyNetRent, ilPayiAylik, ilPayiYillik, ilcePayiAylik, ilcePayiYillik,
        birlikPayiYillik, kesinTeminat, monthlyAmounts, totalAccrued, totalCollected, monthCount };
}

// ===== VIEW =====
let currentView = 'hesaplama';
function setView(v) { currentView = v; state.canteenRent.viewMode = v; render(); }

function render() {
    document.getElementById('btn-hesaplama').className = `px-4 py-2 rounded-lg text-xs font-bold ${currentView==='hesaplama'?'bg-indigo-600 text-white':'bg-slate-200 text-slate-700'}`;
    document.getElementById('btn-sozlesme').className = `px-4 py-2 rounded-lg text-xs font-bold ${currentView==='sozlesme'?'bg-slate-800 text-white':'bg-slate-200 text-slate-700'}`;

    const calc = calculateCanteenRentData();
    document.getElementById('content').innerHTML = currentView === 'sozlesme' ? renderSozlesme(calc) : renderHesaplama(calc);
}

// ===== HESAPLAMA =====
function renderHesaplama(calc) {
    const cr = state.canteenRent;
    const payRows = Object.keys(cr.payments).map(month => {
        const pay = cr.payments[month];
        const isPaid = pay.status === "Ödendi";
        const amt = calc.monthlyAmounts[month];
        return `<tr class="hover:bg-slate-50">
            <td class="p-3 border-r font-bold text-indigo-900">${month}</td>
            <td class="p-3 border-r text-center">
                <select onchange="updatePayType('${month}',this.value)" class="border border-slate-300 rounded px-2 py-1 text-xs font-semibold">
                    <option value="Tam" ${pay.type==='Tam'?'selected':''}>Tam (%100)</option>
                    <option value="Yarım" ${pay.type==='Yarım'?'selected':''}>Yarım (%50)</option>
                </select>
            </td>
            <td class="p-3 border-r text-right font-semibold">${fmt(amt)}</td>
            <td class="p-3 border-r text-center">
                <select onchange="updatePayStatus('${month}',this.value)" class="border rounded px-2 py-1 text-xs font-bold ${isPaid?'bg-emerald-50 text-emerald-800 border-emerald-300':'bg-rose-50 text-rose-800 border-rose-300'}">
                    <option value="Ödendi" ${pay.status==='Ödendi'?'selected':''}>Ödendi</option>
                    <option value="Ödenmedi" ${pay.status==='Ödenmedi'?'selected':''}>Ödenmedi</option>
                </select>
            </td>

            <p class="text-justify"><span class="font-bold">MADDE 6-</span> Kiralama işleminde kira sözleşmesinin süresi <strong>${esc(s.sozlesmeSuresiYil || '5')}</strong> yıldır. Bir yıldan uzun süreli kiralama sözleşmelerinde ilk yıl kira bedeli ihale bedelidir. İkinci ve izleyen yıllar kira bedelleri Türkiye İstatistik Kurumunca (TÜİK) yayımlanan Tüketici Fiyat Endeksi (TÜFE-on iki aylık ortalamalara göre yüzde değişim) oranında artırılır. Ancak kira bedelinin tespitine ilişkin önemli ölçüde farklılaşma (öğrenci mevcudunda en az %25 oranında azalış veya artış, kiracının cirosunu önemli derecede etkileyebilecek Bakanlık tarafından getirilen kısıtlayıcı düzenlemeler) olması hâlinde, muhammen bedel yeniden tespit edilerek mevcut kiracıya aynı usulle sözleşmenin kalan süresi ile sınırlı olmak üzere ihale edilerek yeni sözleşme düzenlenir.</p>

            <p class="text-justify mt-1">Tabii afetler (yangın, deprem, su baskını vs.), bulaşıcı hastalık, salgın gibi olayların çıkması ve benzeri hâller gibi mücbir sebep durumlarında eğitim ve öğretime ara verilen günlere tekabül eden kira tutarı o ayın kira bedelinden düşülerek ödeme yapılır.</p>
            <p class="text-justify mt-1">Mücbir sebepler dışında sözleşme süresi içerisinde aylık kira bedelini iki defa üst üste ödemeyen kiracının sözleşmesi birlikçe tek taraflı olarak feshedilir. Bu durumda, Birliğin alacakları, kesin teminat tutarından mahsup edilir varsa kalan tutar kiracıya iade edilir. Kiracı, bu işlemden dolayı hiçbir hak talep edemez.</p>

        <div class="mb-3">

            <p class="text-justify"><span class="font-bold">MADDE 9-</span> Kantin bizzat kiracı tarafından çalıştırılacaktır. Kantin başkası tarafından çalıştırılamaz, resmî veya gayri resmî devir ve temlik yapılamaz.</p>
            <p class="text-justify mt-1">Kiracının ölümü hâlinde; varislerin noterden alınmış ortak kararıyla, bunlardan birisinin ihaleye katılma şartlarını taşıması, bir başka kantin işletmemesi, sözleşme yükümlülüklerini devam ettirmeyi kabul etmesi kaydıyla birlik yönetimi sözleşmeyi devam ettirebilir.</p>
            <p class="text-justify mt-1">Zorunlu askerlik görevi veya iş göremeyecek derecede ağır hastalık sebebiyle kiracının geçici olarak işinin başında bulunamaması hâlinde, şahsi sorumluluğu devam etmek kaydıyla, askerlik görevinin veya iş göremezlik ağır hastalık bitimine kadar noter vekâleti ile vekil tayin eder. Vekil tayin edilen, yerine vekâlet edilenin görev ve sorumluluklarını yerine getirmekle sorumludur.</p>
            <p class="text-justify mt-1">Kantinler, bu şartların dışında hiçbir şekilde devir, temlik edilemez, başkasına kiraya verilemez ve başkası tarafından çalıştırılamaz.</p>
        </div>

        <div class="mb-3"><p class="text-justify"><span class="font-bold">MADDE 10-</span> Kantinin işletilmesinde 6/12/1984 tarihli ve 3100 sayılı Katma Değer Vergisi Mükelleflerinin Ödeme Kaydedici Cihazları Kullanmaları Mecburiyeti Hakkında Kanun gereğince ödeme kaydedici cihaz (yazar kasa) kullanılır. Ödeme kaydedici cihazın kullanılamayacağı durumlarda, 4/1/1961 tarihli ve 213 sayılı Vergi Usul Kanunda belirtilen fatura veya perakende satış fişi kesilir.</p></div>

        <div class="mb-3">
            <p class="text-justify"><span class="font-bold">MADDE 11-</span> Sözleşme konusu kantin ve benzeri yerlerin elektrik, su, doğal gaz, ısıtma gideri, okulun sayaçlarından ayrı ise tahakkuk eden fatura bedelleri ilgili tahsilât müdürlüklerine, okulun sayaçlarıyla aynı ise idare tarafından tespit edilecek miktar tahakkuk dönemlerinde defterdarlık/malmüdürlüğü/il özel idaresine ödenmek üzere kiracı tarafından okul yönetimine ödenir.</p>
            <p class="text-justify mt-1">Kantin ve benzeri yerlerin elektrik, su ve doğalgaz gibi tesisatın ilk işlem giderleri birlikçe yerine getirilir, abonman, kullanım ve tamir giderleri ise kiracı tarafından karşılanır.</p>
        </div>

        <div class="mb-3"><p class="text-justify"><span class="font-bold">MADDE 12-</span> İşletme hakkı verilen kantinin bulunduğu yer, idarece mahallinde tanzim edilecek tutanakla işleticiye teslim edilir. Tutanakla teslim edilen yerdeki kapı, pencere, dolap, lavabo gibi levazımın tam ve sağlam olup olmadığı, işletme hakkı verilen taşınmaz içerisindeki malzemenin çeşit ve değerleri itibarıyla ayrı ayrı belirtilerek teslim tutanağı düzenlenir. Bu tutanak birlik/okul yönetimi yetkilileri ile işletme hakkı verilen kiracı tarafından imzalanır.</p></div>

        <div class="mb-3"><p class="text-justify"><span class="font-bold">MADDE 13-</span> Kantin ve benzeri yerin işletme hakkı sona erdiğinde, kiracı söz konusu kiraladığı yeri kullanımına bırakılan malzemelerle birlikte birlik, okul/kurum yönetimine bir tutanakla teslim eder.</p></div>

        <div class="mb-3">
            <p class="text-justify"><span class="font-bold">MADDE 14-</span> Kiracı; temizlik ve sağlık koşullarına uygun faaliyette bulunmak zorundadır. Kantinlerde eğitim-öğretimi olumsuz etkileyebilecek görsel ve işitsel kitle iletişim araçları bulundurulamaz. İşletmeci gıda maddelerini hijyen güvenliğinin sağlanması için kırtasiye, temizlik ve benzeri maddeleri diğer maddelerden ayrı yerlerde satışa sunar. Ayrıca sabotaj ve yangın gibi tehlikelere karşı her türlü tedbirleri alır. Kiracıdan kaynaklanan tedbirsizlik, ihmal ve kusur gibi nedenlere bağlı meydana gelecek zarar ziyanı tazmin etmekle yükümlüdür.</p>
            <p class="text-justify mt-1">Fiziki mekânı uygun olan kantinlerde gıda ve hijyen güvenliğinin sağlanması için Türk Standartları Enstitüsünün (TSE) yayımladığı 13275, 13284 ve benzeri diğer standart kriterlerine uyulur.</p>
        </div>

        <div class="mb-3"><p class="text-justify"><span class="font-bold">MADDE 15-</span> Sözleşme süresi içinde; (1) Millî Eğitim Bakanlığı Okul-Aile Birliği Yönetmeliğinin 12 nci maddesinin beşinci fıkrasında sayılan suçları işlediklerinin yargı kararıyla tespiti, (2) İşletme hakkı verilen yerde, işletmecinin ve yanında çalışanların; Devletin güvenliğine aykırı, eğitim öğretim ortamını bozan davranışları, genel ahlaka aykırı görsel, yazılı yayınlar vb. malzemeyi bulundurduklarının tespiti, hâlinde birlik yönetimi kiracının sözleşmesini tek taraflı fesheder. Bu işlemden dolayı kiracı hiçbir hak talep edemez.</p></div>

        <div class="mb-3"><p class="text-justify"><span class="font-bold">MADDE 16-</span> Kiracı, ilgili bakanlık/bakanlıkların kantin ve benzeri yerler ile buralarda bulundurulacak yiyecek ve içecek ve benzeri diğer hususlara ilişkin olarak yayımlanan genelge ve diğer düzenlemelere uymak zorundadır.</p></div>

        <div class="mb-3"><p class="text-justify"><span class="font-bold">MADDE 17-</span> İşletme hakkı verilen yerde hiç bir şekilde "bira" dâhil alkollü içki, tütün ve tütün mamulleri ile enerji içecekleri bulundurulamaz ve satışı yapılamaz. Kantin ve benzeri yerlerde gıda kodeksine uygun öğrencinin ruh ve beden sağlığına faydalı gıda ve içeceklerin bulundurulması zorunludur.</p></div>

        <div class="mb-3"><p class="text-justify"><span class="font-bold">MADDE 18-</span> İşletilen yerin; sözleşme hükümlerine aykırı işletilmesi halinde Bakanlıkça ihtiyaç duyulması halinde tebligatı müteakip on beş gün içinde bu yerlerin tahliyesi sağlanır.</p></div>

        <div class="mb-3"><p class="text-justify"><span class="font-bold">MADDE 19-</span> Kantinin işletilmesinde mesleki ve teknik eğitim diploması, sertifika ile kurs bitirme, ustalık, kalfalık ve işyeri açma belgelerinden en az birine sahip öğrenci psikolojisine uyum sağlayabilecek kişiler istihdam edilir. Çalışan kişilerin bu özelliklere haiz olmaması hâlinde birlik ve okul yönetimince gerekli tedbirler alınır.</p></div>

        <div class="mb-3"><p class="text-justify"><span class="font-bold">MADDE 20-</span> Kiracı, 7/6/2005 tarihli ve 5362 sayılı Esnaf ve Sanatkârlar Meslek Kuruluşları Kanununun 62 nci maddesine göre belirlenen fiyat tarifesini, 7/11/2013 tarihli ve 6502 sayılı Tüketicinin Korunması Hakkında Kanun ve uygulaması ile ilgili yönetmelik gereği öğrencilerin rahatlıkla görebileceği yerlere asar.</p></div>

        <div class="mb-3"><p class="text-justify"><span class="font-bold">MADDE 21–</span> Sözleşme süresi içerisinde okulun fiziki değişikliğe uğraması veya bir başka adresteki okulda faaliyetine devam ettirilmesi durumunda, yeni okulda işletmeci yoksa faaliyetine burada da devam edecektir. Güçlendirme, yangın, onarım ve benzeri nedenlerle geçici olarak eğitim ve öğretime ara verilmesi durumunda kiracının çalışma süresi ve kirası dondurulur. Okulun faaliyete geçmesini müteakip dondurulan süre sözleşme süresine eklenir.</p></div>

        <div class="mb-3">
            <p class="text-center font-bold italic mb-1">Cezai işlemler</p>
            <p class="text-justify"><span class="font-bold">MADDE 22-</span> Kira süresinin sona ermesi veya sözleşmenin feshinden sonra, kiracı taşınmazı idareye teslim etmediği takdirde, her geçen gün için kiracı işletme bedelinden ayrı olarak aylık kira bedelinin %3'ü oranında ayrıca ceza öder. Ceza ödenmesi taşınmazın kullanılmasına ve tahliyesinin geciktirilmesine neden olamaz.</p>
            <p class="text-justify mt-1">Kiracının fesih talebinde bulunması, kira dönemi sona ermeden faaliyetini durdurması, kiralanan yeri amacı dışında kullanması, taahhüdünü sözleşme hükümlerine uygun olarak yerine getirmemesi veya izin ve ruhsatların her ne sebeple olursa olsun iptal edilmesi hallerinde kira sözleşmesi, birlik tarafından feshedilerek ayrıca, protesto çekmeye ve hüküm almaya gerek kalmaksızın 2886 sayılı Devlet İhale Kanununun 62 nci maddesine göre kesin teminatı gelir kaydedilir ve cari kiralama dönemine ilişkin (9 aylık veya 12 aylık) kira bedeli tazminat olarak tahsil edilir.</p>
            <p class="text-justify mt-1">Bu sözleşmede yazılı olan hususlara sözleşme yapılmasından sonra yapılan itirazlar kabul edilmez.</p>
        </div>

        <div class="mb-3"><p class="text-justify"><span class="font-bold">MADDE 23-</span> Bu sözleşmede düzenlenmeyen hususlarda Millî Eğitim Bakanlığı Okul-Aile Birliği Yönetmeliği hükümleri uygulanır.</p></div>

        <div class="mb-3">
            <p class="text-center font-bold italic mb-1">Anlaşmazlıkların çözümü</p>
            <p class="text-justify"><span class="font-bold">MADDE 24-</span> Sözleşme süresinin bitiminde, kiracı kiralanan yeri rızasıyla tahliye etmediği takdirde, 8/9/1983 tarihli ve 2886 sayılı Devlet İhale Kanunu hükümleri gereğince yasal yollara başvurulmak üzere, okul yönetimince mülkiyet durumuna göre İl Muhakemat Müdürlüğü/İl Özel İdaresine bildirilir.</p>
            <p class="text-justify mt-1">Bu sözleşmeden doğan ihtilafların hâl mercii <strong>${esc(s.mahkeme || '................')}</strong> Mahkeme ve İcra Daireleridir.</p>
        </div>

        <div class="mb-3">
            <p class="text-center font-bold italic mb-1">Yürürlük</p>
            <p class="text-justify"><span class="font-bold">MADDE 25-</span> Yirmi beş maddeden oluşan bu sözleşme, taraflarca okunup anlaşılarak <strong>${yururluk}</strong> tarihinde yürürlüğe girmek üzere iki nüsha halinde düzenlenerek <strong>${yururluk}</strong> tarihinde imzalanmıştır.</p>
        </div>

        <div class="text-center font-extrabold uppercase mb-4 mt-8">ÖZEL ŞARTLAR</div>

        <div class="mb-3"><p class="text-justify"><span class="font-bold">MADDE 1-</span> Kiracının değişmesi durumunda; kantine kiracı tarafından yapılan tüm tesis masrafları, kullanım süresi ve amortisman da dikkate alınarak okul, birlik, varsa ilgili oda temsilcisinin/kuruluşun ve gerektiğinde bilirkişi katılımıyla oluşturulan komisyonca takdir edilen meblağ, eski kiracıya yeni kiracı tarafından ödenir. Bu husus ihale ilanında ve şartnamede belirtilir. Ancak kiracının ilk iki yıl içerisinde sözleşmeyi tek taraflı feshetmesi veya sözleşmesinin haklı nedenlerle birlikçe feshedilmesi hâlinde, kiracı kantine yaptığı tüm tesis masrafları için iade veya herhangi bir hak talebinde bulunamaz.</p></div>

        <div class="mb-3"><p class="text-justify"><span class="font-bold">MADDE 2-</span> ${s.ozelSartlar && s.ozelSartlar.trim() ? esc(s.ozelSartlar) : 'Taraflarca ilave bir özel şart belirlenmemiştir.'}</p></div>

        <p class="text-justify text-[10px] italic mt-4">Not: Yirmi beş genel ve iki özel şart olmak üzere toplam yirmi yedi maddeden oluşan işbu sözleşme aşağıdaki imzalarla yürürlük kazanır.</p>

        <div class="grid grid-cols-3 gap-4 mt-16 text-center text-xs">
            <div>
                <div class="border-b border-black h-12 mb-1"></div>
                <p class="font-bold">Birlik Başkanı</p>
                <p class="text-[10px]">Okul-Aile Birliği</p>
            </div>
            <div>
                <div class="border-b border-black h-12 mb-1"></div>
                <p class="font-bold">${esc(cr.operatorName || '................')}</p>
                <p class="text-[10px]">Kiracı</p>
            </div>
            <div>
                <div class="border-b border-black h-12 mb-1"></div>
                <p class="font-bold">&nbsp;</p>
                <p class="text-[10px]">Varsa İlgili Esnaf Odası Temsilcisi</p>
            </div>
        </div>
    </div>`;
}

// ===== MUTATIONS =====
function updateSozlesme(field, val) { state.canteenRent.sozlesme[field] = val; }
function updatePayType(m, v) { state.canteenRent.payments[m].type = v; render(); }
function updatePayStatus(m, v) { state.canteenRent.payments[m].status = v; render(); }
function updatePayField(m, f, v) { state.canteenRent.payments[m][f] = v; }

// ===== INIT =====
render();
</script>
