<script>
// ==========================================
// YARDIMCI FONKSİYONLAR
// ==========================================
function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ==========================================
// MOBİL KENAR ÇUBUĞU (hamburger menü)
// ==========================================
function openSidebar(){
    const aside = document.getElementById('sidebar-aside');
    const overlay = document.getElementById('sidebar-overlay');
    if(aside) aside.classList.remove('-translate-x-full');
    if(overlay) overlay.classList.remove('hidden');
}
function closeSidebar(){
    const aside = document.getElementById('sidebar-aside');
    const overlay = document.getElementById('sidebar-overlay');
    if(aside) aside.classList.add('-translate-x-full');
    if(overlay) overlay.classList.add('hidden');
}

// ==========================================
// KALICI KAYIT (localStorage)
// Not: Önceki sürümde saveAllData() 19 yerden çağrılıyordu ama hiç
// tanımlanmamıştı; bu yüzden hiçbir veri kalıcı olarak saklanmıyordu.
// ==========================================
const ISG_STORAGE_KEY = 'isgModuluDurumu_v1';
let _saveTimer = null;
function saveAllData(){
    try{
        localStorage.setItem(ISG_STORAGE_KEY, JSON.stringify(state));
        const badge = document.getElementById('autosave-badge');
        if(badge){
            badge.classList.remove('opacity-0');
            clearTimeout(_saveTimer);
            _saveTimer = setTimeout(()=>badge.classList.add('opacity-0'), 1200);
        }
    }catch(e){ console.error('Kaydetme hatası:', e); }
}
function loadAllData(){
    try{
        const raw = localStorage.getItem(ISG_STORAGE_KEY);
        if(!raw) return;
        const parsed = JSON.parse(raw);
        if(parsed && typeof parsed==='object'){
            Object.keys(parsed).forEach(k=>{ state[k] = parsed[k]; });
        }
    }catch(e){ console.error('Yükleme hatası (kayıtlı veri bozuk olabilir):', e); }
}

// ==========================================
// ELEKTRİK KESİNTİSİNE KARŞI GÜÇLENDİRİLMİŞ KAYIT
// - Serbest metin alanlarında (textarea/input) her tuş vuruşunda kısa bir
//   gecikmeyle (debounce) kayıt tetiklenir; böylece kullanıcı formu terk
//   etmeden (blur olmadan) elektrik kesintisi yaşansa bile veri kaybı en
//   fazla birkaç yüz milisaniyelik bir pencereyle sınırlı kalır.
// - Ayrıca periyodik bir "güvenlik ağı" kaydı ve sekme kapatma/gizlenme
//   anlarında anında kayıt (flush) eklenmiştir.
// ==========================================
let __isgDebTimer = null;
function isgDebSave(){
    if(__isgDebTimer) clearTimeout(__isgDebTimer);
    __isgDebTimer = setTimeout(function(){ try{ saveAllData(); }catch(e){} }, 300);
}
setInterval(function(){ try{ saveAllData(); }catch(e){} }, 4000);
document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'hidden'){ try{ saveAllData(); }catch(e){} }
});
window.addEventListener('beforeunload', function(){ try{ saveAllData(); }catch(e){} });
window.addEventListener('pagehide', function(){ try{ saveAllData(); }catch(e){} });

// ==========================================
// İÇERİ / DIŞARI AKTARMA (JSON yedek dosyası)
// ==========================================
function isgExportData(){
    try{
        const payload = { _meta:{ app:'İSG Modülü', version:1, disaAktarmaTarihi:new Date().toISOString() }, state:state };
        const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const gun = new Date().toISOString().slice(0,10);
        const okulSlug = String(state.schoolName||'isg').replace(/[^a-zA-Z0-9ığüşöçİĞÜŞÖÇı\s_-]/g,'').trim().replace(/\s+/g,'_') || 'isg';
        a.href = url;
        a.download = 'ISG_Yedek_' + okulSlug + '_' + gun + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    }catch(e){ alert('Dışa aktarma sırasında bir hata oluştu: ' + e.message); }
}
function isgTriggerImport(){
    const inp = document.getElementById('isg-import-file');
    if(inp) inp.click();
}
function isgImportData(input){
    const file = input.files && input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
        let incoming;
        try{
            const parsed = JSON.parse(e.target.result);
            incoming = (parsed && typeof parsed==='object' && parsed.state && typeof parsed.state==='object') ? parsed.state : parsed;
            if(!incoming || typeof incoming!=='object' || Array.isArray(incoming)) throw new Error('format');
        }catch(err){
            alert('Dosya okunamadı. Lütfen bu modülden dışa aktarılmış geçerli bir JSON yedek dosyası seçin.');
            input.value = '';
            return;
        }
        showCustomConfirm('Veriyi İçeri Aktar', 'Seçilen yedek dosyasındaki veriler yüklenecek ve mevcut kayıtlı verilerin yerini alacaktır. Devam etmeden önce isterseniz önce mevcut verilerinizi "Dışa Aktar" ile yedekleyin. Devam edilsin mi?', function(ok){
            if(ok){
                try{
                    Object.keys(state).forEach(function(k){ delete state[k]; });
                    Object.keys(incoming).forEach(function(k){ state[k] = incoming[k]; });
                    saveAllData();
                    updateUI();
                    alert('Veriler başarıyla içeri aktarıldı.');
                }catch(err){
                    alert('İçeri aktarma sırasında bir hata oluştu: ' + err.message);
                }
            }
            input.value = '';
        });
    };
    reader.onerror = function(){ alert('Dosya okunamadı.'); input.value=''; };
    reader.readAsText(file, 'UTF-8');
}

function closeModal(){ const m=document.getElementById('confirm-modal'); m.classList.add('hidden'); m.classList.remove('flex'); }
function showCustomConfirm(title,msg,cb){
    document.getElementById('confirm-title').innerText=title;
    document.getElementById('confirm-message').innerText=msg;
    document.getElementById('confirm-cancel').classList.remove('hidden');
    const m=document.getElementById('confirm-modal'); m.classList.remove('hidden'); m.classList.add('flex');
    document.getElementById('confirm-ok').onclick=()=>{closeModal();cb(true);};
    document.getElementById('confirm-cancel').onclick=()=>{closeModal();cb(false);};
}
let _staffCb=null;
function openStaffModal(title,name,t,tc,cb){
    document.getElementById('staff-modal-title').innerText=title;

}
function closeStaffModal(){ const m=document.getElementById('staff-modal'); m.classList.add('hidden'); m.classList.remove('flex'); _staffCb=null; }
document.getElementById('staff-modal-save').onclick=function(){
    const n=document.getElementById('staff-name').value.trim();

    if(!n||!t){alert('Adı Soyadı ve Görevi boş bırakılamaz.');return;}
    if(_staffCb)_staffCb(n,t,tc);
    closeStaffModal();
};

function isgEnsure(){
  if(!state.isg){
    state.isg = { mode:'auto', sub:'liste', doc:null,
      isverenId:null, isverenVekiliId:null, calisanTemsilcisiId:null, calisanTemsilcisiYedekId:null,
      destek:{koruma:null,kurtarma:null,yangin:null,ilkyardim:null},
      riskEkibi:{bilgiSahibi:null}, kurul:{sekreterId:null,ikId:null,sivilSavunmaId:null,formenId:null},
      seciliPersonelId:null, saha:{}, ozlukKontrol:{}, notlar:'',
      hiddenDocs:{}, editNotes:{} };
  }
  if(!state.isg.hiddenDocs) state.isg.hiddenDocs = {};
  if(!state.isg.editNotes) state.isg.editNotes = {};
  if(!state.isg.metinler) state.isg.metinler = {};
  if(!state.isg.ticks) state.isg.ticks = {};
  if(state.isg.doc===undefined) state.isg.doc = null;
  return state.isg;
}

function isgPreviewAddParagraph(){
  const el = document.getElementById('isg-preview-edit');
  if(!el) return;
  const p = document.createElement('p');
  p.style.textAlign = 'justify';
  p.style.margin = '2mm 0';
  p.textContent = 'Yeni paragraf — burayı düzenleyin...';
  el.appendChild(p);
  // place caret
  try {
    const range = document.createRange();
    range.selectNodeContents(p);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  } catch(e) {}
  isgSavePreviewFromDom();
}

function isgBindPreviewTicks(){
  const root = document.getElementById('isg-preview-edit');
  if(!root || root.__tickBound) return;
  root.__tickBound = true;
  root.addEventListener('click', function(ev){
    let el = ev.target;
    // TD veya tick hücre
    if(el && el.nodeType===3) el = el.parentElement;
    if(!el || !el.closest) return;
    const td = el.closest('td');
    if(!td || !root.contains(td)) return;
    // Sadece dar / işaret sütunları veya data-isg-key / data-isg-tick olanlar
    const hasKey = td.hasAttribute('data-isg-key') || td.hasAttribute('data-isg-tick');
    const w = td.offsetWidth || 0;
    const txt = (td.textContent||'').trim();
    const looksTick = hasKey || (w>0 && w<48 && (txt==='' || txt==='✓' || txt==='X' || txt==='☐' || txt==='□'));
    if(!looksTick) return;
    // contenteditable yazmayı engelle bu hücrede
    ev.preventDefault();
    ev.stopPropagation();
    if(td.hasAttribute('data-isg-tick') && td.getAttribute('onclick')){
      // mevcut onclick zaten çalışır; yine de toggle
      return;
    }
    isgToggleAnyTick(td);
  }, true);
}
function isgOnPreviewInput(){
  // debounce save
  if(window.__isgPrevT) clearTimeout(window.__isgPrevT);
  window.__isgPrevT = setTimeout(function(){ isgSavePreviewFromDom(); }, 400);
}

// Türkçe'de standart JS /i (case-insensitive) regex bayrağı İ/I, ı/i, Ş/ş gibi
// harfleri doğru eşleştirmez (ör. /İlk Yardım/i.test('ilk yardım') === false).
// Bu yüzden hem deseni hem de karşılaştırılan metni Türkçe kurallarına göre
// küçük harfe çevirip, ondan sonra büyük/küçük harf duyarsız bayrak olmadan
// karşılaştırıyoruz — "İsimleri çek" fonksiyonunun büyük/küçük harf farkı
// yüzünden personel bulamaması sorununu bu çözüyor.
function trLower(s){ return String(s||'').toLocaleLowerCase('tr-TR'); }
function trUpper(s){ return String(s||'').toLocaleUpperCase('tr-TR'); }
function isgFindByTitle(patterns){
  const list = state.staff||[];
  const pats = (patterns||[]).map(function(p){ return new RegExp(trLower(p)); });
  for(let i=0;i<pats.length;i++){
    const hit = list.find(function(s){ return pats[i].test(trLower(s.title||'')) || pats[i].test(trLower(s.name||'')); });
    if(hit) return hit.id;
  }
  return null;
}
function isgFindInCommissions(rolePatterns){
  const commissions = state.commissions||[];
  const pats = (rolePatterns||[]).map(function(p){ return new RegExp(trLower(p)); });
  for(let c=0;c<commissions.length;c++){
    const com = commissions[c];
    const roles = com.roles||[];
    const assigned = com.assigned||[];
    for(let r=0;r<roles.length;r++){
      if(!pats.some(function(p){ return p.test(trLower(String(roles[r]||''))); })) continue;
      const a = assigned[r];
      if(a==null || a==='') continue;
      if(typeof a==='object' && a.manual) continue;
      if(typeof a==='object' && a.id) return a.id;
      return a;
    }
  }
  return null;
}
function isgCommissionName(rolePatterns){
  const commissions = state.commissions||[];
  const pats = (rolePatterns||[]).map(function(p){ return new RegExp(trLower(p)); });
  for(let c=0;c<commissions.length;c++){
    const com = commissions[c];
    const roles = com.roles||[];
    const assigned = com.assigned||[];
    for(let r=0;r<roles.length;r++){
      if(!pats.some(function(p){ return p.test(trLower(String(roles[r]||''))); })) continue;
      const a = assigned[r];
      if(a==null || a==='') continue;
      if(typeof a==='object' && a.manual) return a.name||String(a.manual)||'……………………';

function isgSetField(path, val){
  const g=isgEnsure();
  const parts=path.split('.');
  let o=g;
  for(let i=0;i<parts.length-1;i++){ if(!o[parts[i]]) o[parts[i]]={}; o=o[parts[i]]; }
  o[parts[parts.length-1]] = val === '' ? null : (isNaN(val)? val : (val===''?null:Number(val)||val));
  // also try keep as string id
  if(val!=='' && !isNaN(val)) o[parts[parts.length-1]] = Number(val);
  else o[parts[parts.length-1]] = val===''?null:val;
  try{saveAllData();}catch(e){}
}

/** Önizlemede herhangi bir hücreye dokununca ✓ koy/kaldır (aylık plan vb.) */
function isgToggleAnyTick(el){
  try {
    if(!el) return;
    // contenteditable içinde tıklanınca seçimi bozma
    if(window.event){ try{ window.event.preventDefault(); window.event.stopPropagation(); }catch(e){} }
    const cur = (el.textContent||'').trim();
    if(cur === '✓' || cur === 'X' || cur === 'x'){
      el.textContent = '';
      el.style.background = '';
      el.style.fontWeight = '400';
    } else {
      el.textContent = '✓';
      el.style.background = '#dcfce7';
      el.style.fontWeight = '700';
    }
    // state kaydı
    const key = el.getAttribute('data-isg-key');
    if(key){
      const g = isgEnsure();
      if(!g.ticks) g.ticks = {};
      g.ticks[key] = (el.textContent === '✓') ? '✓' : '';
      try{saveAllData();}catch(e){}
    }
    if(document.getElementById('isg-preview-edit')){
      try{ isgSavePreviewFromDom(); }catch(e){}
    }
  } catch(e){ console.error(e); }
}
function isgTickCell(el, type, index, val){
  try {
    if(type==='saha') isgSetSaha(index, val);
    else if(type==='ozluk') isgSetOzluk(index, val);
    const tr = el && el.parentElement;
    if(tr){
      const cells = tr.querySelectorAll('[data-isg-tick]');
      const cur = type==='saha' ? (isgEnsure().saha[index]||'') : (isgEnsure().ozlukKontrol[index]||'');
      cells.forEach(function(c){
        const cv = c.getAttribute('data-isg-tick');
        c.textContent = (cv === cur) ? '✓' : '';
        c.style.fontWeight = (cv === cur) ? '700' : '400';
        c.style.background = (cv === cur) ? '#dcfce7' : '';
      });
    }
    if(document.getElementById('isg-preview-edit')) {
      try { isgSavePreviewFromDom(); } catch(e2) {}
    }
  } catch(e){ console.error(e); }
}

function isgOpenDoc(id){
  const g=isgEnsure();
  g.doc = id;
  g.sub = 'detay';
  currentNav = 'liste';
  try{saveAllData();}catch(e){}
  updateUI();
}
function isgBackListe(){
  const g=isgEnsure();
  g.doc = null;
  g.sub = 'liste';
  currentNav = 'liste';
  try{saveAllData();}catch(e){}
  updateUI();
}
function isgHideDoc(id){
  if(!confirm('Bu evrak listeden kaldırılsın mı?')) return;
  isgEnsure().hiddenDocs[id]=true;
  isgEnsure().doc=null; isgEnsure().sub='liste';
  currentNav = 'liste';
  try{saveAllData();}catch(e){}
  updateUI();
}
function isgUnhideAll(){
  isgEnsure().hiddenDocs={};
  try{saveAllData();}catch(e){}
  updateUI();
}
function isgResetDoc(id){
  if(!confirm('Bu evraka ait işaretlemeler / seçimler ve canlı metin sıfırlansın mı?')) return;
  const g=isgEnsure();
  if(id==='saha') g.saha={};
  if(id==='ozlukKontrol') g.ozlukKontrol={};
  if(id==='talimat'||id==='uyumEgitim'||id==='kkd'||id==='fazlaCalisma'||id==='riskAnket'||id==='ozlukKontrol') g.seciliPersonelId=null;
  g.editNotes[id]='';
  if(g.metinler && g.metinler.live) delete g.metinler.live[id];
  if(g.metinler && g.metinler.extra) delete g.metinler.extra[id];
  try{saveAllData();}catch(e){}
  updateUI();
}

  try { isgAutoFillFromPool(false); } catch(e) {}
  const over = isgIsOver50();
  const cnt = isgStaffCount();
  const modeLabel = g.mode==='auto' ? ('Otomatik ('+cnt+' personel → '+(over?'50 ve üstü':'50 altı')+')') : (g.mode==='over50'?'50 ve üstü (manuel)':'50 altı (manuel)');

function isgRunAutoFill(){
  isgAutoFillFromPool(true);
  isgEnsure()._showFillReport = true;
  try{ saveAllData(); }catch(e){}
  updateUI();
}
function isgCloseFillReport(){
  isgEnsure()._showFillReport = false;
  updateUI();
}
function isgAutoFillReportHtml(g){
  if(!g._showFillReport) return '';
  const rows = isgAutoFillSummary();
  const filled = rows.filter(r=>r.filled);
  const missing = rows.filter(r=>!r.filled);
  let html = '<div class="border border-indigo-200 bg-indigo-50 rounded-lg p-3 text-sm space-y-2">'+
    '<div class="flex items-center justify-between">'+
      '<b class="text-indigo-900">↻ İsimler personel havuzundan çekildi</b>'+
      '<button type="button" onclick="isgCloseFillReport()" class="text-xs text-indigo-500 hover:text-indigo-800">Kapat ✕</button>'+
    '</div>';
  if(filled.length){
    html += '<div class="text-emerald-800"><b>Eşleşen ('+filled.length+'):</b> '+
      filled.map(r=>escHtml(r.label)+' → '+escHtml(r.name)).join(' · ')+'</div>';
  }
  if(missing.length){
    html += '<div class="text-amber-800"><b>Eşleşmeyen ('+missing.length+'):</b> '+
      missing.map(r=>escHtml(r.label)).join(', ')+
      '<div class="text-xs text-amber-700 mt-1">Bu roller için personel havuzunda unvanı uyan kimse bulunamadı ya da ilgili göreve elle kişi atamanız gerekiyor. İlgili evrakı açıp kişiyi elle seçebilirsiniz.</div></div>';
  }
  html += '</div>';
  return html;
}

function isgRenderListe(g, over){
  const cats = {};
  const hidden = g.hiddenDocs||{};
  let hiddenCount = 0;
  isgDocCatalog().forEach(d=>{
    if(hidden[d.id]){ hiddenCount++; return; }
    if(!cats[d.cat]) cats[d.cat]=[];
    cats[d.cat].push(d);
  });
  let html = '';
  if(hiddenCount>0){
    html += '<div class="flex justify-end"><button type="button" onclick="isgUnhideAll()" class="text-xs text-blue-600 hover:underline">Gizli evrakları göster ('+hiddenCount+')</button></div>';
  }
  Object.keys(cats).forEach(cat=>{
    html += '<div class="mb-4"><h3 class="text-sm font-bold text-slate-500 uppercase tracking-wide mb-2 px-1">'+escHtml(cat)+'</h3>';
    html += '<div class="border border-slate-200 rounded-xl overflow-hidden divide-y divide-slate-100 bg-white">';
    cats[cat].forEach(d=>{
      html += '<button type="button" onclick="isgOpenDoc(\''+d.id+'\')" class="w-full text-left px-4 py-3 hover:bg-emerald-50 flex items-start gap-3 transition">'+
        '<span class="text-lg mt-0.5">📄</span>'+
        '<span class="flex-1 min-w-0">'+
          '<span class="block font-semibold text-slate-800 text-sm">'+escHtml(d.title)+'</span>'+
          '<span class="block text-xs text-slate-500 mt-0.5">'+escHtml(d.desc)+'</span>'+
        '</span>'+
        '<span class="text-slate-400 text-sm">›</span>'+
      '</button>';
    });
    html += '</div></div>';
  });
  if(!html) html = '<p class="text-slate-500 text-sm">Gösterilecek evrak yok.</p>';
  return html;
}

function isgEditPanel(g, cat){
  let h = '';
  if(cat.needsPerson){
    h += isgSelect('İlgili personel', 'seciliPersonelId', g.seciliPersonelId);
  }
  if(cat.id==='isverenVekili' || cat.id==='destekElemani' || cat.id==='calisanTemsilcisi' || cat.id==='riskEkibi' || cat.id==='kurulAtama' || cat.id==='kurulToplanti' || cat.id==='kurulEgitim' || cat.id==='temsilciTalimat' || cat.id==='riskEgitim' || cat.id==='riskProsedur'){
    h += '<div class="grid sm:grid-cols-2 gap-3 mt-2">';
    if(['isverenVekili','destekElemani','calisanTemsilcisi','riskEkibi','kurulAtama','riskProsedur','temsilciTalimat','riskEgitim'].indexOf(cat.id)>=0){
      h += isgSelect('İşveren (Müdür)', 'isverenId', g.isverenId);
      h += isgSelect('İşveren Vekili', 'isverenVekiliId', g.isverenVekiliId);
    }
    if(cat.id==='destekElemani' || cat.id==='riskEkibi' || cat.id==='riskEgitim'){
      h += isgSelect('Koruma/Arama/Tahliye B.', 'destek.koruma', g.destek.koruma);
      h += isgSelect('Kurtarma B.', 'destek.kurtarma', g.destek.kurtarma);
      h += isgSelect('Yangın B.', 'destek.yangin', g.destek.yangin);
      h += isgSelect('İlk Yardım B.', 'destek.ilkyardim', g.destek.ilkyardim);
    }
    if(cat.id==='calisanTemsilcisi' || cat.id==='riskEkibi' || cat.id==='temsilciTalimat' || cat.id==='kurulAtama' || cat.id==='kurulToplanti' || cat.id==='kurulEgitim' || cat.id==='riskEgitim'){
      h += isgSelect('Çalışan Temsilcisi', 'calisanTemsilcisiId', g.calisanTemsilcisiId);
      h += isgSelect('Temsilci Yedek', 'calisanTemsilcisiYedekId', g.calisanTemsilcisiYedekId);
    }
    if(cat.id==='riskEkibi' || cat.id==='riskEgitim'){

function isgDoPrint(html){
  const printRoot = document.getElementById('print-root');
  if(!printRoot){ alert('Yazdırma alanı bulunamadı.'); return; }
  let pageStyle = document.getElementById('isg-native-page');
  if(!pageStyle){ pageStyle=document.createElement('style'); pageStyle.id='isg-native-page'; document.head.appendChild(pageStyle); }
  pageStyle.innerHTML = [
    '@media print{',
    '@page{size:A4 portrait;margin:12mm 12mm 16mm 12mm;}',
    'html,body{background:#fff!important;height:auto!important;overflow:visible!important;}',
    'body.print-isolated > *:not(#print-root){display:none!important;visibility:hidden!important;}',
    'body.print-isolated #print-root{display:block!important;visibility:visible!important;position:static!important;height:auto!important;max-height:none!important;overflow:visible!important;width:100%!important;margin:0 auto!important;}',
    '#print-root,.isg-scope,#print-root *{height:auto!important;max-height:none!important;overflow:visible!important;}',
    '.isg-scope{font-family:Times New Roman,Georgia,serif;font-size:11pt;color:#000;line-height:1.4;}',
    '}',
    '#print-root{display:none;}',
    'body.print-isolated #print-root{display:block!important;}'
  ].join('');
  printRoot.innerHTML = '<div class="isg-scope">'+html+'</div>';
  printRoot.style.cssText = 'width:18.6cm;margin:0 auto;display:block;';
  document.body.classList.add('print-isolated');
  var cleaned=false;
  var cleanup=function(){
    if(cleaned) return;
    cleaned=true;
    document.body.classList.remove('print-isolated');
    printRoot.innerHTML='';
    printRoot.style.cssText='';
    window.removeEventListener('afterprint', onAfter);
  };
  var onAfter=function(){ setTimeout(cleanup, 1500); };
  window.addEventListener('afterprint', onAfter);
  setTimeout(function(){ try{ window.print(); }catch(e){ console.error(e); cleanup(); } }, 50);
  setTimeout(cleanup, 12000);
}

function isgDocBody(kind){
  const g = isgEnsure();
  try { isgAutoFillFromPool(false); } catch(e) {}
  // Canlı önizleme kaydı varsa (kullanıcı dokunarak düzenlediyse) onu kullan
  try {
    let liveId = g.doc;
    if(!liveId){
      const cat = isgDocCatalog().find(d=>d.print===kind);
      if(cat) liveId = cat.id;
    }
    const live = liveId ? isgGetLiveHtml(liveId) : '';
    if(live && String(live).trim()) return live;
  } catch(e) {}
  let body = '';
  const iv = isgNameOr(g.isverenId, ['Başkan \(Müdür\)','^Okul Müdürü$','^Müdür$']);
  const ivv = isgNameOr(g.isverenVekiliId, ['Müdür Yardımcısı','Başkan \(Müdür Yrd','İşveren Vekili']);
  const ct = isgNameOr(g.calisanTemsilcisiId, ['Çalışan Temsilcisi']);
  const pers = isgPersonName(g.seciliPersonelId);

  if(kind==='isverenVekili'){
    body = isgPrintHead('İŞVEREN VEKİLİ ATAMA FORMU') +
      `<p style="text-align:justify">${escHtml(isgKurum())} Müdürlüğünde, İş Sağlığı ve Güvenliği çalışmaları kapsamında yapılacak olan iş ve işlemlerde, işverenin sorumluluğu dâhilindeki görevleri yürütmek ve uygulamak amacı ile <b>${escHtml(ivv)}</b> İşveren Vekili olarak okul/kurum müdürü tarafından atanmıştır.</p>
      <p style="margin-top:6mm"><b>İşveren Vekili</b><br>Adı Soyadı: ${escHtml(ivv)}<br>Unvanı: ${escHtml(isgPersonTitle(g.isverenVekiliId))}</p>
      <p style="margin-top:4mm">Tarih: ${isgBugun()}</p>` +

      <p style="text-align:justify;font-size:9.5pt;margin:1mm 0">Bu prosedürün amacı; eğitim-öğretim faaliyetleri sırasında oluşabilecek potansiyel tehlikelerin ve bunlara ilişkin risklerin belirlenmesini, beklenen veya olası risklerin kontrol altına alınmasına ilişkin yöntem ve esasların sistematik biçimde tanımlanmasını sağlayarak iş kazaları ve meslek hastalıklarının asgari seviyelere indirilmesini gerçekleştirmektir.</p>

      <p style="font-weight:700;font-size:10.5pt;margin:3mm 0 1mm">2. KAPSAM</p>
      <p style="text-align:justify;font-size:9.5pt;margin:1mm 0">Bu prosedür, ${escHtml(isgKurum())} ve bağlı birimlerinin tüm bölümlerini kapsar.</p>

      <p style="font-weight:700;font-size:10.5pt;margin:3mm 0 1mm">3. TANIMLAR</p>
      <p style="text-align:justify;font-size:9pt;margin:1mm 0"><b>Kanun:</b> 30/06/2012 tarihli ve 6331 sayılı İş Sağlığı ve Güvenliği Kanunu.<br>
      <b>Yönetmelik:</b> 29/12/2012 tarihli ve 28512 sayılı İş Sağlığı ve Güvenliği Risk Değerlendirmesi Yönetmeliği.<br>
      <b>Tehlike:</b> İşyerinde var olan ya da dışarıdan gelebilecek, çalışanı veya işyerini etkileyebilecek zarar veya hasar verme potansiyeli.<br>
      <b>Risk:</b> Tehlikeden kaynaklanacak kayıp, yaralanma ya da başka zararlı sonuç meydana gelme ihtimali.<br>
      <b>Kabul edilebilir risk seviyesi:</b> Yasal yükümlülüklere ve işyerinin önleme politikasına uygun, kayıp veya yaralanma oluşturmayacak risk seviyesi.<br>
      <b>Önleme:</b> İşlerin bütün safhalarında İSG risklerini ortadan kaldırmak veya azaltmak için planlanan ve alınan tedbirlerin tümü.<br>
      <b>Ramak kala olay:</b> Çalışanı, işyerini veya iş ekipmanını zarara uğratma potansiyeli olduğu halde zarara uğratmayan olay.<br>
      <b>Risk Değerlendirme Sonucu (RDS):</b> Olasılık × Şiddet × Frekans değeri.<br>
      <b>Risk derecelendirmesi:</b> RDS sonucuna göre tehlikelerin önem sırası.</p>

      <p style="font-weight:700;font-size:10.5pt;margin:3mm 0 1mm">4. SORUMLULAR</p>
      <p style="text-align:justify;font-size:9.5pt;margin:1mm 0">Bu prosedürün uygulanmasından ${escHtml(isgKurum())} bünyesinde çalışan tüm personel sorumludur. Risk analizi çalışmaları, sürecin devamında işveren/işveren vekili ve risk değerlendirme ekibi tarafından izlenir ve iyileştirilir.</p>

      <p style="font-weight:700;font-size:10.5pt;margin:3mm 0 1mm">5. PROSEDÜR AKIŞI</p>
      <p style="font-weight:700;font-size:10pt;margin:2mm 0 1mm">5.1 Risk değerlendirmesi</p>
      <p style="text-align:justify;font-size:9.5pt;margin:1mm 0">Tasarım veya kuruluş aşamasından başlamak üzere tehlikeleri tanımlama, riskleri belirleme ve analiz etme, risk kontrol tedbirlerinin kararlaştırılması, dokümantasyon, güncelleme ve gerektiğinde yenileme aşamaları izlenerek gerçekleştirilir. Değerlendirmede <b>Kinney metodu</b> uygulanır.</p>

      <p style="font-weight:700;font-size:10pt;margin:2mm 0 1mm">5.2 Risk değerlendirmesi ekibi</p>
      <p style="text-align:justify;font-size:9.5pt;margin:1mm 0">Risk değerlendirmesi, işverenin oluşturduğu ekip tarafından yapılır. Ekip asgari olarak şunlardan oluşur:</p>
      <ol style="font-size:9.5pt;padding-left:6mm;margin:1mm 0">
        <li>İşveren veya işveren vekili</li>
        <li>İş güvenliği uzmanı ve işyeri hekimi (görevlendirilmişse)</li>
        <li>Çalışan temsilcileri</li>
        <li>Destek elemanları</li>
        <li>Birimleri temsil eden, tehlike ve riskler konusunda bilgi sahibi çalışanlar</li>
      </ol>
      <p style="text-align:justify;font-size:9.5pt;margin:1mm 0">İşveren gerektiğinde işyeri dışından destek alabilir; ekip üyelerinin araç, gereç, mekân ve zaman ihtiyaçlarını karşılar; görev nedeniyle haklarını kısıtlayamaz. Ekip üyeleri kendilerine verilen bilgi ve belgeleri gizli tutar.</p>

      <p style="font-weight:700;font-size:10pt;margin:2mm 0 1mm">5.3 Tehlikelerin belirlenmesi</p>
      <p style="text-align:justify;font-size:9.5pt;margin:1mm 0">Tehlikeler tanımlanırken çalışma ortamı, çalışanlar ve işyerine ilişkin asgari olarak şu bilgiler toplanır: işyeri bina ve eklentileri; yürütülen faaliyetler; iş ekipmanları; kullanılan maddeler; artık ve atıklar; organizasyon ve hiyerarşi; çalışan tecrübe ve görüşleri; eğitim, yaş, cinsiyet ve özel politika gerektiren gruplar; teftiş, meslek hastalığı, iş kazası ve ramak kala kayıtları; ortam ölçümleri; varsa önceki risk değerlendirmeleri; acil durum planları.</p>
      <p style="text-align:justify;font-size:9.5pt;margin:1mm 0">Toplanan bilgiler ışığında fiziksel, kimyasal, biyolojik, psikososyal, ergonomik ve benzeri tehlike kaynaklarından doğan veya bunların etkileşimiyle ortaya çıkabilecek tehlikeler belirlenir. Bina yerleşimi, elektrik ve yardımcı tesisat, yanıcı-patlayıcı maddeler, hijyen, ulaşım yolları ve eğitim eksikliği gibi hususlar ayrıca değerlendirilir. Gerekli kontrol, ölçüm ve araştırmalar yapılır.</p>

      <p style="font-weight:700;font-size:10pt;margin:2mm 0 1mm">5.4 Risk değerlendirmesinin yenilenmesi</p>
      <p style="text-align:justify;font-size:9.5pt;margin:1mm 0">Yapılmış risk değerlendirmesi tehlike sınıfına göre <b>çok tehlikeli işyerlerinde en geç 2 yılda, tehlikeli işyerlerinde en geç 4 yılda, az tehlikeli işyerlerinde en geç 6 yılda</b> bir yenilenir.</p>
      <p style="text-align:justify;font-size:9.5pt;margin:1mm 0">Aşağıdaki durumlarda tamamen veya kısmen yenilenir: işyerinin taşınması veya binalarda değişiklik; teknoloji, madde veya ekipman değişikliği; üretim yönteminde değişiklik; iş kazası, meslek hastalığı veya ramak kala; sınır değerlere ilişkin mevzuat değişikliği; ortam ölçümü veya sağlık gözetimi sonucuna göre gereklilik; işyeri dışından kaynaklanan yeni tehlike.</p>

      <p style="font-weight:700;font-size:10pt;margin:2mm 0 1mm">5.5 Risklerin belirlenmesi ve analizi (Kinney)</p>
      <p style="text-align:justify;font-size:9.5pt;margin:1mm 0">Tespit edilen her tehlike için riskin sıklığı ile kimlerin, nelerin, ne şekilde ve hangi şiddette zarar görebileceği belirlenir; mevcut kontrol tedbirlerinin etkisi dikkate alınır. Analiz edilen riskler önem sırasına göre sıralanır.</p>

      <p style="font-size:9.5pt;margin:2mm 0 1mm"><b>Frekans</b></p>

        <tr><th style="border:0.3mm solid #000;padding:1mm">Değer</th><th style="border:0.3mm solid #000;padding:1mm">Tehlikeye zaman içinde maruz kalma tekrarı</th></tr>
        <tr><td style="border:0.3mm solid #000;padding:1mm;text-align:center">10</td><td style="border:0.3mm solid #000;padding:1mm">Hemen hemen sürekli (saatte birkaç defa)</td></tr>
        <tr><td style="border:0.3mm solid #000;padding:1mm;text-align:center">6</td><td style="border:0.3mm solid #000;padding:1mm">Sık (günde bir veya birkaç defa)</td></tr>
        <tr><td style="border:0.3mm solid #000;padding:1mm;text-align:center">3</td><td style="border:0.3mm solid #000;padding:1mm">Ara sıra (haftada bir veya birkaç defa)</td></tr>
        <tr><td style="border:0.3mm solid #000;padding:1mm;text-align:center">2</td><td style="border:0.3mm solid #000;padding:1mm">Sık değil (ayda bir veya birkaç defa)</td></tr>
        <tr><td style="border:0.3mm solid #000;padding:1mm;text-align:center">1</td><td style="border:0.3mm solid #000;padding:1mm">Seyrek (yılda birkaç defa)</td></tr>
        <tr><td style="border:0.3mm solid #000;padding:1mm;text-align:center">0,5</td><td style="border:0.3mm solid #000;padding:1mm">Çok seyrek (yılda bir veya daha seyrek)</td></tr>

        <tr><td style="border:0.3mm solid #000;padding:1mm">200 &lt; R ≤ 400</td><td style="border:0.3mm solid #000;padding:1mm"><b>Yüksek risk (2)</b> — Kısa dönemde iyileştirilmeli (birkaç ay)</td></tr>
        <tr><td style="border:0.3mm solid #000;padding:1mm">70 &lt; R ≤ 200</td><td style="border:0.3mm solid #000;padding:1mm"><b>Orta risk (3)</b> — Uzun dönemde iyileştirilmeli (yıl içinde)</td></tr>
        <tr><td style="border:0.3mm solid #000;padding:1mm">20 &lt; R ≤ 70</td><td style="border:0.3mm solid #000;padding:1mm"><b>Kabul edilebilir risk (4)</b> — Gözetim altında uygulanmalı</td></tr>
        <tr><td style="border:0.3mm solid #000;padding:1mm">R ≤ 20</td><td style="border:0.3mm solid #000;padding:1mm"><b>Önemsiz risk (5)</b> — Önlem öncelikli değildir; süreç izlenir</td></tr>
      </table>

      <p style="font-weight:700;font-size:10pt;margin:2mm 0 1mm">5.6 Önlemlerin değerlendirilmesi</p>
      <p style="text-align:justify;font-size:9.5pt;margin:1mm 0"><b>Kabul edilemez:</b> İş durdurulur; tehlike kontrol altına alınır; prosedür/talimat, izleme-ölçme, düzeltici-önleyici faaliyet ve eğitim planlanır; periyodik denetim yapılır.<br>
      <b>Yüksek:</b> Kısa dönemde iyileştirme; kontrol, dokümantasyon, eğitim ve yönetime raporlama.<br>
      <b>Orta:</b> Uzun dönemde iyileştirme; sürekli kontrol; eğitim.<br>
      <b>Kabul edilebilir / önemsiz:</b> Gözetim; risk artışı halinde yeniden değerlendirme.</p>

      <p style="font-weight:700;font-size:10pt;margin:2mm 0 1mm">5.7 Risk kontrol adımları</p>

        <li><b>Uygulama</b> — İşlem basamakları, sorumlu, başlangıç-bitiş tarihli planlar işverence uygulamaya konulur.</li>
        <li><b>İzleme</b> — Planlar denetlenir; aksayan yönler düzeltilir.</li>
      </ol>
      <p style="text-align:justify;font-size:9.5pt;margin:1mm 0">Toplu korunma, kişisel korunmaya göre önceliklidir; önlemler yeni risk oluşturmamalıdır. Tedbir sonrası risk seviyesi yeniden belirlenir; kabul edilebilir seviyenin üzerindeyse adımlar tekrarlanır.</p>
      <p style="text-align:justify;font-size:9.5pt;margin:1mm 0"><b>Kontrol hiyerarşisi:</b> (a) Ortadan kaldırma (b) Yerine koyma (c) Mühendislik kontrolleri (d) İşaretler/uyarılar ve idari kontroller (e) Kişisel koruyucu donanım.</p>

      <p style="font-weight:700;font-size:10pt;margin:2mm 0 1mm">5.8 Dokümantasyon</p>

  }
  else if(kind==='kurulEgitim'){
    body = isgPrintHead('İSG KURUL ÜYELERİ EĞİTİM TUTANAĞI') +

        <tr><th style="border:0.3mm solid #000;padding:1.5mm">Adı Soyadı</th><th style="border:0.3mm solid #000;padding:1.5mm">Görevi</th><th style="border:0.3mm solid #000;padding:1.5mm">İmza</th></tr>
        ${[[ivv||iv,'Başkan'],[isgPersonName(g.kurul.sekreterId),'Sekreter'],[isgPersonName(g.kurul.ikId),'İK/İdari'],[isgPersonName(g.kurul.sivilSavunmaId),'Sivil Savunma'],[ct,'Çalışan Temsilcisi']].map(r=>`<tr><td style="border:0.3mm solid #000;padding:1.5mm">${escHtml(r[0])}</td><td style="border:0.3mm solid #000;padding:1.5mm">${r[1]}</td><td style="border:0.3mm solid #000;padding:1.5mm;height:7mm"></td></tr>`).join('')}
      </table>` +
      isgPrintImza('Eğitimi Veren', `<b>${escHtml(iv)}</b><br>İşveren`);
  }
  else {
    return '<p style="color:#b91c1c">Bu belge için şablon tanımlı değil: '+escHtml(kind)+'</p>';
  }
  let extraTxt = isgGetDocExtra(kind);
  if(!extraTxt && kind){
    try {
      const cat = isgDocCatalog().find(d=>d.print===kind);
      if(cat) extraTxt = isgGetDocExtra(cat.id);
    } catch(e) {}
  }
  if(extraTxt && String(extraTxt).trim()){
    body += '<p style="margin-top:4mm;text-align:justify;font-size:10pt;white-space:pre-wrap">'+escHtml(extraTxt)+'</p>';
  }
  return body;
}
function isgPrint(kind){
  try {
    const body = isgDocBody(kind);
    if(!body || body.indexOf('şablon tanımlı değil')>=0){ alert('Yazdırılacak içerik yok.'); return; }
    isgDoPrint(body);
  } catch(e) {
    alert('Yazdırma hatası: '+(e && e.message ? e.message : e));
    console.error(e);
  }
}

let currentNav = 'liste';
function isgNav(nav) {
    if(nav==='liste'){ const g=isgEnsure(); g.doc=null; g.sub='liste'; }
    currentNav = nav;
    closeSidebar();
    updateUI();
    const main = document.querySelector('main');
    if(main) main.scrollTo({top:0, behavior:'smooth'});
}
function updateUI() {
    const app = document.getElementById('app');
    let html = '';
    if(currentNav==='liste') html = renderIsg();
    else if(currentNav==='personel') html = renderPersonelView();
    else if(currentNav==='yillikPlan') html = renderYillikPlanView();
    else if(currentNav==='saha') html = renderSahaView();
    else if(currentNav==='talimat') html = renderTalimatView();
    app.innerHTML = html;
    document.querySelectorAll('.sidebar-btn').forEach(btn => {
        const n = btn.getAttribute('data-nav');
        const active = n===currentNav;
        btn.classList.toggle('bg-slate-800', active);
        btn.classList.toggle('text-white', active);
        btn.classList.toggle('active-nav', active);
    });
}

function renderListeView(){
    const g = isgEnsure();
    try { isgAutoFillFromPool(false); } catch(e) {}
    if(g.sub==='detay' && g.doc) return renderDetayView(g);
    const cats = {};
    const hidden = g.hiddenDocs||{};
    let hiddenCount = 0;
    isgDocCatalog().forEach(d=>{
        if(hidden[d.id]){ hiddenCount++; return; }
        if(!cats[d.cat]) cats[d.cat]=[];
        cats[d.cat].push(d);
    });
    let html = '';
    if(hiddenCount>0) html += `<div class="flex justify-end mb-2"><button onclick="isgUnhideAll()" class="text-xs text-blue-600 hover:underline">Gizli evrakları göster (${hiddenCount})</button></div>`;
    Object.keys(cats).forEach(cat=>{
        html += `<div class="mb-4"><h3 class="text-sm font-bold text-slate-500 uppercase tracking-wide mb-2 px-1">${escHtml(cat)}</h3>
            <div class="border border-slate-200 rounded-xl overflow-hidden divide-y divide-slate-100 bg-white">`;
        cats[cat].forEach(d=>{
            html += `<button onclick="isgOpenDoc('${d.id}')" class="w-full text-left px-4 py-3 hover:bg-emerald-50 flex items-start gap-3 transition">
                <span class="text-lg mt-0.5">📄</span><span class="flex-1 min-w-0">
                <span class="block font-semibold text-slate-800 text-sm">${escHtml(d.title)}</span>
                <span class="block text-xs text-slate-500 mt-0.5">${escHtml(d.desc)}</span>
                </span><span class="text-slate-400 text-sm">›</span></button>`;
        });
        html += '</div></div>';
    });
    if(!html) html = '<p class="text-slate-500 text-sm">Gösterilecek evrak yok.</p>';
    return html;
}

function renderDetayView(g){
    const cat = isgDocCatalog().find(d=>d.id===g.doc);

function renderYillikPlanView(){
    const g = isgEnsure();
    try { isgAutoFillFromPool(false); } catch(e) {}
    const iv = isgNameOr(g.isverenId, ['Başkan \\(Müdür\\)','^Okul Müdürü$','^Müdür$']);
    const ivv = isgNameOr(g.isverenVekiliId, ['Müdür Yardımcısı','Başkan \\(Müdür Yrd']);
    const monthFull = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
    function monthsMark(spec){
        if(!spec||spec==='—') return monthFull.map(()=>'');
        if(spec==='1-12') return monthFull.map(()=> '✓');
        const marks = monthFull.map(()=>'');
        String(spec).split(',').forEach(function(part){
            part=part.trim();
            if(part.indexOf('-')>=0){ const ab=part.split('-'); const a=parseInt(ab[0],10),b=parseInt(ab[1],10); for(let m=a;m<=b;m++) if(m>=1&&m<=12) marks[m-1]='✓'; }
            else { const m=parseInt(part,10); if(m>=1&&m<=12) marks[m-1]='✓'; }
        });
        return marks;
    }
    let tables = '';
    ISG_YILLIK_PLAN.forEach(function(sec){
        tables += `<p class="font-bold text-xs bg-slate-200 px-2 py-1 rounded mt-3 mb-1">${escHtml(sec.sec)}. ${escHtml(sec.title)}</p>`;
        tables += '<div class="overflow-x-auto mb-2"><table class="w-full text-[10px] border-collapse"><thead class="bg-slate-100 sticky top-0"><tr><th class="border border-slate-300 p-1 w-8">No</th><th class="border border-slate-300 p-1 text-left">Çalışma konusu</th><th class="border border-slate-300 p-1 w-24">Sorumlu</th><th class="border border-slate-300 p-1 w-16">Periyot</th>';
        monthFull.forEach(m=> tables += `<th class="border border-slate-300 p-0.5 w-8">${m}</th>`);
        tables += '</tr></thead><tbody>';
        sec.items.forEach(function(it){
            const mk = monthsMark(it[4]);
            tables += `<tr><td class="border border-slate-300 p-1 text-center">${escHtml(it[0])}</td><td class="border border-slate-300 p-1 text-left">${escHtml(it[1])}</td><td class="border border-slate-300 p-1">${escHtml(it[2])}</td><td class="border border-slate-300 p-1">${escHtml(it[3])}</td>`;
            mk.forEach(function(x,mi){
                const key = 'yp_'+sec.sec+'_'+it[0]+'_'+mi;
                const saved = (isgEnsure().ticks&&isgEnsure().ticks[key])||x||'';
                const on = saved==='✓';
                tables += `<td data-isg-key="${key}" onclick="isgToggleAnyTick(this)" class="border border-slate-300 p-1 text-center cursor-pointer select-none ${on?'bg-emerald-100 font-bold':''}">${on?'✓':''}</td>`;
            });
            tables += '</tr>';
        });
        tables += '</tbody></table></div>';
    });
    return `<div class="mb-4 flex justify-between items-center">
        <div><h3 class="text-xl font-bold text-slate-800">📅 İSG Yıllık Çalışma Planı</h3><p class="text-xs text-slate-500 mt-1">A–Ö bölümleri, aylık takip tablosu. Hücrelere tıklayarak ✓ koyabilir/kaldırabilirsiniz.</p></div>
        <button onclick="isgPrint('yillikPlan')" class="px-4 py-2 bg-slate-800 text-white rounded-lg text-xs font-bold hover:bg-slate-900"><svg class="w-3.5 h-3.5 mr-1.5 inline" style="vertical-align:-2px" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8V3h8v5M4 8h12v6H4V8zM6 12h8v5H6v-5z"/></svg> Yazdır</button>
    </div>` + tables;
}

    </div>
    <div class="overflow-x-auto border border-slate-200 rounded-xl bg-white">
        <table class="w-full text-left"><thead class="bg-slate-50 sticky top-0"><tr>

            <th class="px-1 py-2 text-xs font-bold text-slate-500 text-center w-10">E</th>
            <th class="px-1 py-2 text-xs font-bold text-slate-500 text-center w-10">H</th>
            <th class="px-1 py-2 text-xs font-bold text-slate-500 text-center w-10">K</th>

}
