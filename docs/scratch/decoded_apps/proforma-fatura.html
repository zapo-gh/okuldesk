<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Proforma Fatura</title>
    <style>
        :root {
            --brand: #1e3a8a;
            --brand-light: #eff6ff;
            --accent: #2563eb;
            --ink: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 10px;
            --radius-xs: 8px;
            --shadow-sm: 0 1px 3px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
            --shadow-md: 0 4px 14px rgba(15,23,42,0.08), 0 2px 4px rgba(15,23,42,0.04);
            --shadow-lg: 0 12px 32px rgba(15,23,42,0.12), 0 4px 8px rgba(15,23,42,0.06);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #f8fafc; color: var(--ink); margin: 0; padding: 16px;
            display: flex; flex-direction: column; align-items: center;
            -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 20px; }
        * { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }

        /* ── Toast ── */
        .toast-notification {
            position: fixed; bottom: 20px; right: 20px; z-index: 9999;
            background: var(--ink); color: white; padding: 14px 24px;
            border-radius: var(--radius-md); font-size: 14px; font-weight: 600;
            box-shadow: 0 12px 32px rgba(0,0,0,0.2);
            transform: translateY(100px); opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .toast-notification.show { transform: translateY(0); opacity: 1; }

        /* ── Action Bar ── */
        .action-bar {
            width: 100%; max-width: 800px;
            background: white; padding: 16px 20px;
            border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
            margin-bottom: 16px; display: flex; flex-direction: column; gap: 12px;
            border: 1px solid var(--border); animation: fadeInUp 0.4s ease-out both;
        }
        .action-text { margin: 0; font-size: 13px; color: var(--muted); text-align: center; font-weight: 500; }
        .action-buttons { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }

        /* ── Buttons ── */
        .btn {
            border: none; padding: 11px 22px; font-size: 14px; font-weight: 700;
            border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 140px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        }
        .btn:active { transform: scale(0.97); }
        .add-btn { background: linear-gradient(135deg, #10b981, #059669); color: white; margin-top: 10px; box-shadow: 0 4px 12px rgba(16,185,129,0.3); }
        .add-btn:hover { box-shadow: 0 6px 16px rgba(16,185,129,0.4); transform: translateY(-1px); }
        .print-btn { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
        .print-btn:hover { box-shadow: 0 6px 16px rgba(37,99,235,0.4); transform: translateY(-1px); }
        .clear-btn { background: linear-gradient(135deg, #dc2626, #b91c1c); color: white; box-shadow: 0 4px 12px rgba(220,38,38,0.25); }
        .clear-btn:hover { box-shadow: 0 6px 16px rgba(220,38,38,0.35); transform: translateY(-1px); }
        .export-btn { background: linear-gradient(135deg, #0ea5e9, #0284c7); color: white; box-shadow: 0 4px 12px rgba(14,165,233,0.25); }
        .export-btn:hover { box-shadow: 0 6px 16px rgba(14,165,233,0.35); transform: translateY(-1px); }
        .import-btn { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: white; box-shadow: 0 4px 12px rgba(139,92,246,0.25); }
        .import-btn:hover { box-shadow: 0 6px 16px rgba(139,92,246,0.35); transform: translateY(-1px); }
        .upload-btn { background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; padding: 7px 14px; min-width: auto; font-size: 12px; margin-top: 5px; box-shadow: 0 4px 12px rgba(99,102,241,0.25); }

        /* ── Invoice Box ── */
        .invoice-box {
            width: 100%; max-width: 800px; background: white; padding: 24px;
            box-shadow: var(--shadow-lg); border-radius: var(--radius-lg);
            overflow: hidden; border: 1px solid var(--border);
            animation: fadeInUp 0.4s ease-out 0.1s both;
        }

        /* ── Header ── */
        .header {
            display: flex; flex-direction: column; align-items: center;
            border-bottom: 3px solid var(--brand); padding-bottom: 16px; margin-bottom: 20px; text-align: center;
        }
        .header-title h1 { color: var(--brand); font-size: 24px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: 900; }
        .header-date { font-weight: 700; font-size: 14px; display: flex; flex-direction: column; align-items: center; color: var(--muted); }

        /* ── Inputs ── */
        input[type="date"] {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size: 15px; text-align: center; padding: 8px;
            border: 1.5px solid var(--border); background: #fafbfc; border-radius: var(--radius-xs);
            cursor: pointer; transition: var(--transition);
        }
        input[type="date"]:focus { outline: none; border-color: var(--accent); background: white; box-shadow: 0 0 0 3px rgba(37,99,235,0.08); }
        input[type="date"]::-webkit-calendar-picker-indicator { background: transparent; bottom: 0; color: transparent; cursor: pointer; height: auto; left: 0; position: absolute; right: 0; top: 0; width: auto; }

        .editable-input, .editable-textarea {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size: inherit; color: inherit;
            border: 1.5px solid var(--border); background: #fafbfc; padding: 8px 10px;
            border-radius: var(--radius-xs); box-sizing: border-box; transition: var(--transition); width: 100%;
        }
        .editable-textarea { resize: none; overflow: hidden; min-height: 38px; line-height: 1.5; }
        .editable-input:focus, .editable-textarea:focus { outline: none; border-color: var(--accent); background: white; box-shadow: 0 0 0 3px rgba(37,99,235,0.08); }
        .customer-input { font-weight: 700; max-width: 100%; margin: 5px 0; text-align: center; }
        .tax-input { max-width: 250px; text-align: center; margin-top: 5px; }

        /* ── Customer Info ── */
        .customer-info {
            margin-bottom: 20px; font-size: 14px; line-height: 1.6;
            display: flex; flex-direction: column; align-items: center; text-align: center;
        }
        .customer-info strong { color: var(--brand); }

        /* ── Table ── */
        .table-container { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 10px; border: 1px solid var(--border); border-radius: var(--radius-md); padding-left: 32px; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th {
            background: linear-gradient(135deg, var(--brand), #2563eb); color: white;
            padding: 12px 8px; font-size: 12px; text-align: left; border: 1px solid rgba(255,255,255,0.1);
            white-space: nowrap; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
        }
        td { border: 1px solid #f1f5f9; padding: 4px; font-size: 13px; vertical-align: middle; position: relative; }
        .col-sira { width: 5%; text-align: center; vertical-align: middle; }
        .col-tanim { width: 40%; min-width: 200px; }
        .col-kdv { width: 10%; min-width: 60px; text-align: center; }
        .col-adet { width: 15%; min-width: 100px; text-align: center; }
        .col-fiyat { width: 15%; min-width: 80px; text-align: right; }
        .col-toplam { width: 15%; min-width: 90px; text-align: right; font-weight: 700; vertical-align: middle; }
        tr:nth-child(even) { background: #fafbfd; }
        tr { transition: var(--transition); }
        tr:hover { background: #f0f7ff; }

        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        .table-input, .table-textarea, .item-unit {
            width: 100%; box-sizing: border-box; border: 1.5px solid transparent;
            background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size: inherit; color: inherit;
            padding: 8px 6px; transition: var(--transition); border-radius: 4px;
        }
        
        .table-textarea { resize: none; overflow: hidden; min-height: 30px; line-height: 1.5; }
        
        .table-input:hover, .table-input:focus, .table-textarea:hover, .table-textarea:focus, .item-unit:hover, .item-unit:focus {
            border-color: var(--accent); background: var(--brand-light); outline: none;
        }
        
        .qty-wrapper {
            display: flex; align-items: center; gap: 4px;
        }
        .qty-wrapper .item-qty { width: 55%; padding-right: 2px; }
        .qty-wrapper .item-unit { width: 45%; padding-left: 2px; cursor: pointer; }

        .center { text-align: center; } .right { text-align: right; }

        .delete-row-btn {
            position: absolute; left: -28px; top: 50%; transform: translateY(-50%);
            color: #dc2626; cursor: pointer; font-size: 14px; font-weight: bold;
            background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px;
            padding: 2px 6px; transition: var(--transition);
            display: block;
        }
        .delete-row-btn:hover { background: #fee2e2; transform: translateY(-50%) scale(1.1); }

        /* ── Footer ── */
        .footer-section { display: flex; flex-direction: column; gap: 20px; margin-top: 16px; }
        .notes { width: 100%; font-size: 13px; color: #4b5563; }
        .notes strong { color: var(--ink); }
        .totals { width: 100%; align-self: flex-end; background: #f8fafc; padding: 14px; border-radius: var(--radius-md); border: 1px solid var(--border); }
        .totals table { min-width: auto; margin: 0; border: none; }
        .totals th { background: transparent; color: #374151; border: none; border-bottom: 1px solid #e2e8f0; text-align: right; padding: 8px 12px; font-weight: 500; text-transform: none; letter-spacing: 0; }
        .totals td { border: none; border-bottom: 1px solid #e2e8f0; text-align: right; font-weight: 700; padding: 8px 12px; }
        .totals tr.grand-total th, .totals tr.grand-total td { border-bottom: none; font-size: 16px; color: var(--brand); padding-top: 12px; font-weight: 800; }

        /* ── Stamp ── */
        .company-stamp-section { margin-top: 20px; display: flex; flex-direction: column; align-items: flex-start; text-align: left; }
        .stamp-wrapper { display: flex; flex-direction: column; align-items: flex-start; width: 250px; }
        .stamp-image-container { margin-top: 5px; min-height: 80px; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; }
        #stampImagePreview { max-width: 220px; max-height: 150px; object-fit: contain; display: none; border-radius: 8px; }

        /* ── Responsive ── */
        @media (min-width: 640px) {
            .header { flex-direction: row; justify-content: space-between; text-align: left; }
            .header-date { align-items: flex-end; }
            .customer-info { flex-direction: row; justify-content: space-between; text-align: left; align-items: flex-start; }
            .customer-input { text-align: left; }
            .tax-input { text-align: left; }
            .footer-section { flex-direction: row; justify-content: space-between; }
            .notes { width: 50%; }
            .totals { width: 45%; }
            .action-bar { flex-direction: row; justify-content: space-between; align-items: center; }
            .action-text { text-align: left; }
        }

        @media (max-width: 639px) {
            body { padding: 8px; }
            .invoice-box { padding: 16px; }
            .action-bar { padding: 12px; }
            .btn { padding: 12px 16px; min-width: 120px; font-size: 13px; }
            input[type="text"], input[type="number"], input[type="date"], textarea, select {
                font-size: 16px !important;
            }
        }

        /* ── Print ── */
        @media print {
            @page { size: A4 portrait; margin: 10mm; }
            body { background: white; margin: 0; padding: 0; display: block; }
            .no-print { display: none !important; }
            
            /* Düzeltildi: Yazıcıda boş yer tutucu (placeholder) metinlerin basılması engellendi */
            ::placeholder { color: transparent !important; }
            
            .table-container { overflow-x: visible !important; border: none; margin-bottom: 5px; border-radius: 0; padding-left: 0; }
            
            /* Düzeltildi: Yazıcıda tablo çizgileri belirginleştirildi */
            td { border: 1px solid #cbd5e1 !important; }
            
            .editable-input, .editable-textarea, .table-input, .table-textarea, input[type="date"] {
                border: none !important; background: transparent !important; padding: 0 !important; margin: 0 !important;
                width: 100% !important; box-shadow: none !important; resize: none !important;
                -webkit-appearance: none !important; -moz-appearance: none !important; appearance: none !important;
                line-height: 1.5 !important; vertical-align: middle !important; font-size: 13px !important;
            }
            .item-unit {
                border: none !important; background: transparent !important; padding: 0 !important; margin: 0 !important;
                box-shadow: none !important;
                -webkit-appearance: none !important; -moz-appearance: none !important; appearance: none !important;
                text-align: left; line-height: 1.5 !important; vertical-align: middle !important; font-size: 13px !important;
            }
            .col-sira, .item-name, .item-kdv, .item-qty, .item-price, .item-unit, .item-total { vertical-align: middle !important; }
            .qty-wrapper { align-items: center !important; }
            input[type="date"]::-webkit-calendar-picker-indicator, input[type="date"]::-webkit-clear-button { display: none !important; -webkit-appearance: none !important; }
            .right { text-align: right !important; } .center { text-align: center !important; }
            .invoice-box { width: 100%; max-width: 100%; box-shadow: none; border: none; padding: 0; margin: 0; border-radius: 0; }
            th { background: var(--brand) !important; color: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            tr.empty-row { display: none !important; }
            table { page-break-inside: avoid; }
            .totals { page-break-inside: avoid; border-radius: 0; }
            .company-stamp-section { page-break-inside: avoid; margin-top: 15px; }
            .qty-wrapper { gap: 2px; justify-content: center; }
            .qty-wrapper .item-qty { text-align: right !important; width: auto; padding-right: 4px !important; }
            .qty-wrapper .item-unit { width: auto; }
        }
    </style>
</head>
<body>

    <!-- Toast -->
    <div id="toastEl" class="toast-notification"></div>

    <!-- Üst Çubuk -->
    <div class="action-bar no-print">
        <p class="action-text">Tarih kutusuna tıklayarak takvimden seçim yapabilirsiniz. Kaşenizi yükleyip kaydedebilirsiniz.</p>
        <div class="action-buttons">
            <button class="btn export-btn" onclick="exportAllData()">📤 Dışa Aktar</button>
            <button class="btn import-btn" onclick="document.getElementById('importFileInput').click()">📥 İçe Aktar</button>
            <input type="file" id="importFileInput" accept=".json" style="display:none;" onchange="importAllData(event)">
            <button class="btn clear-btn" onclick="clearData()">🗑️ Temizle</button>
            <button class="btn print-btn" onclick="prepareForPrint()">🖨️ Yazdır / PDF</button>
        </div>
    </div>

    <!-- Fatura İçeriği -->
    <div class="invoice-box">

        <div class="header">
            <div class="header-title"><h1>PROFORMA FATURA</h1></div>
            <div class="header-date">
                TARİH: <br>
                <div style="position: relative;">
                    <input type="date" id="docDate" class="saved-field">
                </div>
            </div>
        </div>

        <div class="customer-info">
            <div style="flex-grow: 1;">
                <strong>Sayın,</strong><br>
                <textarea id="docCustomer" class="editable-textarea customer-input saved-field auto-expand" placeholder="Müşteri Adı Giriniz" rows="1"></textarea>
            </div>
            <div style="margin-top: 10px; margin-left: 10px;">
                <strong>Vergi Kimlik No:</strong><br>
                <input type="text" id="docTaxNo" class="editable-input tax-input saved-field" placeholder="Vergi No Giriniz">
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="col-sira">Sıra</th>
                        <th class="col-tanim">Mal Tanımı</th>
                        <th class="col-kdv">KDV (%)</th>
                        <th class="col-adet">Miktar</th>
                        <th class="col-fiyat">Birim Fiyat</th>
                        <th class="col-toplam">Toplam Fiyat</th>
                    </tr>
                </thead>
                <tbody id="invoice-items"></tbody>
            </table>
            <button class="btn add-btn no-print" onclick="addNewRow()">+ Yeni Kalem Ekle</button>
        </div>

        <div class="footer-section">
            <div class="notes">
                <strong>Notlar:</strong>
                <p>• FİYAT TL OLARAK VERİLMİŞTİR.</p>
                <p>• FİYAT GEÇERLİLİK SÜRESİ : 10 GÜNDÜR</p>

                <div class="company-stamp-section">
                    <div class="stamp-wrapper">
                        <div class="stamp-image-container">
                            <img id="stampImagePreview" src="" alt="Firma Kaşesi">
                            <label for="stampUpload" class="btn upload-btn no-print">📸 Kaşe Yükle / Değiştir</label>
                            <input type="file" id="stampUpload" accept="image/*" style="display: none;" onchange="handleStampUpload(event)">
                            <button id="removeStampBtn" class="btn clear-btn no-print" style="display: none; padding: 4px 10px; min-width: auto; font-size: 11px; margin-top: 5px;" onclick="removeStamp()">Kaşeyi Kaldır</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="totals">
                <table>
                    <tbody id="totals-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'proformaV4Data';
        const UNIT_OPTIONS = ['Adet', 'Paket', 'Kutu', 'Litre', 'Kg', 'Gram', 'Metre', 'm²', 'Çuval', 'Koli', 'Ton', 'Ay', 'Yıl', 'Saat', 'Gün', 'Takım', 'Set'];
        let isClearing = false;

        // ── Helper: Virgüllü sayıları güvenli parse etme ──
        function parseNum(val) {
            if (val === undefined || val === null) return 0;
            const cleanStr = String(val).replace(',', '.');
            const num = parseFloat(cleanStr);
            return isNaN(num) ? 0 : num;
        }

        // ── Toast ──
        function showToast(msg) {
            const t = document.getElementById('toastEl');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function getTodayDate() {
            return new Date().toLocaleDateString('en-CA');
        }

        function autoExpand(field) {
            if (!field || window.matchMedia('print').matches) return;
            field.style.height = 'auto';
            const computed = window.getComputedStyle(field);
            const height = field.scrollHeight
                         + parseInt(computed.getPropertyValue('border-top-width'), 10)
                         + parseInt(computed.getPropertyValue('border-bottom-width'), 10);
            field.style.height = height + 'px';
        }

        function createRowHTML(index, data = {}) {
            const unit = data.unit || 'Adet';
            const unitOptionsHTML = UNIT_OPTIONS.map(u => `<option value="${u}" ${u === unit ? 'selected' : ''}>${u}</option>`).join('');

            return `
            <tr>
                <td class="col-sira">
                    <button class="delete-row-btn no-print" onclick="deleteRow(this)" tabindex="-1" title="Satırı Sil">✖</button>
                    <span class="row-index">${index}</span>
                </td>
                <td><textarea class="table-textarea item-name saved-item auto-expand" placeholder="Malzeme adı girin..." rows="1">${data.name || ''}</textarea></td>
                <td class="center"><input type="number" step="any" min="0" class="table-input item-kdv center saved-item" placeholder="%" value="${data.kdv !== undefined ? data.kdv : ''}"></td>
                <td class="center">
                    <div class="qty-wrapper">
                        <input type="number" step="any" min="0" class="table-input item-qty right saved-item" placeholder="0" value="${data.qty !== undefined ? data.qty : ''}">
                        <select class="item-unit saved-item">
                            ${unitOptionsHTML}
                        </select>
                    </div>
                </td>
                <td class="right"><input type="number" step="any" class="table-input item-price right saved-item" placeholder="Fiyat" value="${data.price !== undefined ? data.price : ''}"></td>
                <td class="col-toplam item-total"></td>
            </tr>`;
        }

        function updateRowIndices() {
            const rows = document.querySelectorAll('#invoice-items tr');
            rows.forEach((row, idx) => {
                row.querySelector('.row-index').textContent = idx + 1;
                const delBtn = row.querySelector('.delete-row-btn');
                if (delBtn) {
                    delBtn.style.display = rows.length === 1 ? 'none' : 'block';
                }
            });
        }

        function addNewRow(data = {}) {
            const tbody = document.getElementById('invoice-items');
            const currentIndex = tbody.children.length + 1;
            tbody.insertAdjacentHTML('beforeend', createRowHTML(currentIndex, data));
            updateRowIndices();
            const newTextarea = tbody.lastElementChild.querySelector('.item-name');
            if (newTextarea) autoExpand(newTextarea);
            saveData();
        }

        function deleteRow(btn) {
            const row = btn.closest('tr');
            row.remove();
            updateRowIndices();
            calculateTotals();
            saveData();
        }

        // Düzeltildi: Aynı dosya seçildiğinde re-upload çalışması için input.value temizlendi
        function handleStampUpload(event) {
            const file = event.target.files[0];
            if (file) {
                if (!file.type.startsWith('image/')) {
                    showToast('Lütfen geçerli bir resim dosyası seçin!');
                    event.target.value = '';
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const MAX_WIDTH = 300;
                        const scale = Math.min(1, MAX_WIDTH / img.width);
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const data = imageData.data;
                        for (let i = 0; i < data.length; i += 4) {
                            const brightness = (data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114);
                            if (brightness > 160) { data[i+3] = 0; }
                            else if (brightness > 70) { data[i+3] = 255 - ((brightness - 70) * (255 / 90)); }
                        }
                        ctx.putImageData(imageData, 0, 0);
                        document.getElementById('stampImagePreview').src = canvas.toDataURL('image/png');
                        document.getElementById('stampImagePreview').style.display = 'block';
                        document.getElementById('removeStampBtn').style.display = 'inline-block';
                        event.target.value = '';
                        saveData();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function removeStamp() {
            document.getElementById('stampImagePreview').src = '';
            document.getElementById('stampImagePreview').style.display = 'none';
            document.getElementById('removeStampBtn').style.display = 'none';
            document.getElementById('stampUpload').value = '';
            saveData();
        }

        function saveData() {
            if (isClearing) return;
            const data = {
                header: {
                    date: document.getElementById('docDate').value,
                    customer: document.getElementById('docCustomer').value,
                    taxNo: document.getElementById('docTaxNo').value
                },
                stamp: document.getElementById('stampImagePreview').src,
                items: []
            };
            document.querySelectorAll('#invoice-items tr').forEach(row => {
                data.items.push({
                    name: row.querySelector('.item-name').value,
                    kdv: row.querySelector('.item-kdv').value,
                    qty: row.querySelector('.item-qty').value,
                    unit: row.querySelector('.item-unit').value,
                    price: row.querySelector('.item-price').value
                });
            });
            try { 
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); 
            } catch (e) {
                showToast('Uyarı: Kayıt hafızası dolu, değişiklikler kaydedilemedi!');
            }
        }

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            const tbody = document.getElementById('invoice-items');
            tbody.innerHTML = '';
            if (!saved) {
                document.getElementById('docDate').value = getTodayDate();
                addNewRow();
            } else {
                try {
                    const data = JSON.parse(saved);
                    if (data.header) {
                        document.getElementById('docDate').value = data.header.date || getTodayDate();
                        document.getElementById('docCustomer').value = data.header.customer || '';
                        document.getElementById('docTaxNo').value = data.header.taxNo || '';
                        setTimeout(() => autoExpand(document.getElementById('docCustomer')), 50);
                    }
                    if (data.stamp && data.stamp.length > 100) {
                        document.getElementById('stampImagePreview').src = data.stamp;
                        document.getElementById('stampImagePreview').style.display = 'block';
                        document.getElementById('removeStampBtn').style.display = 'inline-block';
                    }
                    if (data.items && data.items.length > 0) {
                        data.items.forEach(itemData => addNewRow(itemData));
                    } else {
                        addNewRow();
                    }
                } catch (e) { addNewRow(); }
            }
        }

        function clearData() {
            if (confirm('Faturadaki tüm verileri silmek istediğinize emin misiniz?')) {
                isClearing = true;
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        }

        // Düzeltildi: Türkçe virgüllü girişler için parseNum kullanıldı
        function calculateTotals() {
            let araToplam = 0;
            let dynamicKdvRates = {};
            document.querySelectorAll('#invoice-items tr').forEach(row => {
                const qty = parseNum(row.querySelector('.item-qty').value);
                const price = parseNum(row.querySelector('.item-price').value);
                const kdvRate = parseNum(row.querySelector('.item-kdv').value);
                const totalCell = row.querySelector('.item-total');
                const rowTotal = qty * price;
                araToplam += rowTotal;
                
                totalCell.textContent = (qty > 0 || price !== 0) ? rowTotal.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '';
                
                if (rowTotal > 0 && kdvRate > 0) {
                    if (!dynamicKdvRates[kdvRate]) dynamicKdvRates[kdvRate] = 0;
                    const lineKdv = Math.round(rowTotal * (kdvRate / 100) * 100) / 100;
                    dynamicKdvRates[kdvRate] += lineKdv;
                }
            });
            
            const formatCurrency = (val) => val.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' TL';
            const totalsBody = document.getElementById('totals-body');
            let totalsHtml = `<tr><th>Ara Toplam:</th><td>${formatCurrency(araToplam)}</td></tr>`;
            let toplamKdvMiktari = 0;
            
            Object.keys(dynamicKdvRates).sort((a,b) => Number(a) - Number(b)).forEach(rate => {
                const kdvAmount = dynamicKdvRates[rate];
                toplamKdvMiktari += kdvAmount;
                totalsHtml += `<tr><th>KDV % ${rate}:</th><td>${formatCurrency(kdvAmount)}</td></tr>`;
            });
            
            const genelToplam = araToplam + toplamKdvMiktari;
            totalsHtml += `<tr class="grand-total"><th>GENEL TOPLAM:</th><td>${formatCurrency(genelToplam)}</td></tr>`;
            totalsBody.innerHTML = totalsHtml;
        }

        function prepareForPrint() {
            document.querySelectorAll('#invoice-items tr').forEach(row => {
                const nameText = row.querySelector('.item-name').value.trim();
                const qtyVal = row.querySelector('.item-qty').value.trim();
                const priceVal = row.querySelector('.item-price').value.trim();

                if (nameText === '' && qtyVal === '' && priceVal === '') { 
                    row.classList.add('empty-row'); 
                } else { 
                    row.classList.remove('empty-row'); 
                }
            });
            window.print();
        }

        // ══════════════════════════════════════
        // DIŞA / İÇE AKTAR
        // ══════════════════════════════════════
        function exportAllData() {
            saveData();
            const saved = localStorage.getItem(STORAGE_KEY);
            const data = saved ? JSON.parse(saved) : {};
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const date = getTodayDate();
            a.href = url;
            a.download = `proforma-fatura_${date}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('Veriler dışa aktarıldı.');
        }

        function importAllData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data.header) { showToast('Hata: Geçersiz dosya!'); return; }
                    if (!confirm('Mevcut fatura verilerinin üzerine yazılacak. Emin misiniz?')) return;
                    
                    isClearing = true;
                    try {
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                        location.reload();
                    } catch (err) {
                        showToast('Hata: Dosya boyutu tarayıcı hafıza sınırını aşıyor!');
                    }
                } catch (err) { showToast('Hata: Dosya okunamadı!'); }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ══════════════════════════════════════
        // OTOMATİK KAYIT & OLAYLAR
        // ══════════════════════════════════════
        // Düzeltildi: Yazdırmadan önce mal tanımı kutularının yüksekliği (padding'siz haliyle)
        // yeniden hesaplanır, böylece metin diğer sütunlarla aynı hizada ortalanır.
        window.addEventListener('beforeprint', function() {
            document.querySelectorAll('.auto-expand').forEach(function(field) {
                field.dataset.prePrintHeight = field.style.height;
                field.style.height = 'auto';
                field.style.height = field.scrollHeight + 'px';
            });
        });

        window.addEventListener('afterprint', function() {
            document.querySelectorAll('.auto-expand').forEach(function(field) {
                if (field.dataset.prePrintHeight) {
                    field.style.height = field.dataset.prePrintHeight;
                    delete field.dataset.prePrintHeight;
                } else {
                    autoExpand(field);
                }
            });
        });

        window.addEventListener('beforeunload', function() {
            if (!isClearing) { try { saveData(); } catch(e) {} }
        });

        setInterval(function() {
            try { saveData(); } catch(e) {}
        }, 30000);

        window.onload = function() {
            loadData();
            calculateTotals();

            const handleUserInteraction = function(e) {
                if (e.target.classList.contains('auto-expand')) autoExpand(e.target);
                if (e.target.classList.contains('saved-item') || e.target.classList.contains('saved-field')) {
                    calculateTotals();
                    saveData();
                }
            };

            document.addEventListener('input', handleUserInteraction, false);
            document.addEventListener('change', handleUserInteraction, false);

            window.addEventListener('resize', function() {
                document.querySelectorAll('.auto-expand').forEach(autoExpand);
            });

            // Düzeltildi: Web fontları yüklendiğinde metin alanlarının yüksekliği yeniden hesaplanır
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(function() {
                    document.querySelectorAll('.auto-expand').forEach(autoExpand);
                });
            }
        };
    </script>
</body>
</html>
