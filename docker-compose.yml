version: '3.8'

# ⚠️  NOT: OkulDesk bir masaüstü uygulamasıdır (Tauri v2).
# Bu docker-compose.yml; sunucu/CI ortamları için referans olarak sunulmaktadır.
# Üretim kullanımı için Tauri dağıtımını tercih edin.
# Prisma şeması SQLite kullanır — aşağıdaki yapılandırma buna uygun ayarlanmıştır.

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: okuldesk-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      # SQLite — Prisma şemasıyla uyumlu
      DATABASE_URL: file:/app/data/database.db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET ortam degiskeni zorunludur (min 32 karakter)}
      JWT_EXPIRES_IN: 8h
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /app/backups
    volumes:
      - sqlite_data:/app/data
      - uploads_data:/app/uploads
      - backups_data:/app/backups
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Frontend (Nginx + React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: okuldesk-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

  # Nginx Reverse Proxy — HTTPS (opsiyonel, üretim için)
  nginx:
    image: nginx:alpine
    container_name: okuldesk-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "443:443"
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot:ro
    profiles:
      - production

  # Certbot — Let's Encrypt (opsiyonel)
  certbot:
    image: certbot/certbot
    container_name: okuldesk-certbot
    volumes:
      - certbot_data:/var/www/certbot
      - ./nginx/ssl:/etc/letsencrypt
    profiles:
      - production

volumes:
  sqlite_data:       # SQLite veritabanı dosyası
  uploads_data:      # Yüklenen PDF/görsel dosyalar
  backups_data:      # Otomatik SQLite snapshot yedekleri
  certbot_data:
